<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Factory</title>
<style>
  :root {
    color-scheme: dark;
    --ease: cubic-bezier(.22,.61,.36,1);
    --dim: rgba(232,242,255,.46);
    --lit: #fff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: #06080b;
    color: #fff;
    font: 300 16px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── the wave ─────────────────────────────────────────────────────────── */
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .bg .tint {
    position: absolute; inset: 0;
    background:
      radial-gradient(75% 60% at 26% 10%, rgba(46,88,138,.60), transparent 70%),
      radial-gradient(60% 50% at 80% 84%, rgba(64,52,116,.45), transparent 72%),
      radial-gradient(95% 75% at 50% 42%, #0e1826, #06080b 80%);
  }
  .wave { position: absolute; inset: -8% -18%; width: 136%; height: 116%; transform: translateY(-3%); }
  .wave path { stroke-linecap: round; }
  .ribbon { animation: sweep 44s linear infinite; will-change: transform; }
  .ribbon.b { animation-duration: 63s; animation-direction: reverse; }
  .ribbon.c { animation-duration: 82s; }
  @keyframes sweep {
    from { transform: translate3d(-5%, 0, 0); }
    to   { transform: translate3d(5%, 0, 0); }
  }
  .crest { filter: blur(2.5px); }
  .glow  { filter: blur(34px); }


  /* ── clock ────────────────────────────────────────────────────────────── */
  .clock { position: fixed; top: 2.1rem; right: 2.7rem; text-align: right; pointer-events: none; }
  .clock time {
    display: block; font-size: 1.45rem; font-weight: 200; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(0,0,0,.65);
  }
  .clock span {
    display: block; margin-top: .1rem; font-size: .64rem; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(226,238,255,.4);
  }

  /* ── the rail ─────────────────────────────────────────────────────────── */
  .xmb { position: absolute; left: 0; right: 0; top: 43%; transform: translateY(-50%); overflow: hidden; }
  .rail {
    display: flex; align-items: flex-start;
    will-change: transform;
  }
  .rail.ready { transition: transform .42s var(--ease); }
  .col { flex: 0 0 172px; width: 172px; display: flex; flex-direction: column; align-items: center; }

  .cat {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: .5rem;
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    color: #fff;
    transition: color .3s, transform .3s var(--ease), opacity .3s;
  }
  .cat svg {
    width: 44px; height: 44px; opacity: .45;
    transition: width .32s var(--ease), height .32s var(--ease), opacity .3s, filter .3s;
  }
  .cat span {
    font-size: .62rem; letter-spacing: .18em; font-weight: 500; text-transform: uppercase; white-space: nowrap; color: rgba(255,255,255,.78);
    opacity: 0; transition: opacity .3s; text-shadow: 0 0 10px rgba(170,210,255,.7);
  }
  .col[data-sel="1"] .cat { color: var(--lit); }
  .col[data-sel="1"] .cat span { color: #fff; }
  .col[data-sel="1"] .cat svg {
    width: 52px; height: 52px; opacity: 1;
    filter:
      drop-shadow(0 0 2px rgba(255,255,255,.7))
      drop-shadow(0 0 12px rgba(168,205,255,.55))
      drop-shadow(0 0 26px rgba(110,165,255,.35));
  }
  .col[data-sel="1"] .cat span { opacity: 1; }

  /* ── the list ─────────────────────────────────────────────────────────── */
  .items { list-style: none; margin: 2.3rem 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; }
  .items a {
    position: relative; display: grid; place-items: center; height: 54px;
    text-decoration: none; color: var(--dim);
    transition: color .2s;
  }
  .tile {
    width: 24px; height: 24px; border-radius: 6px;
    background:
      radial-gradient(115% 95% at 28% 6%, rgba(255,255,255,.55), rgba(255,255,255,0) 58%),
      linear-gradient(157deg, hsl(var(--h, 210) 64% 62%), hsl(var(--h, 210) 56% 38%));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.30),
      0 6px 14px -8px rgba(0,0,0,.95);
    transition: width .22s var(--ease), height .22s var(--ease), box-shadow .22s, filter .22s;
  }
  .items a[data-sel="1"] .tile {
    width: 30px; height: 30px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -2px 5px rgba(0,0,0,.28),
      0 0 0 1px rgba(255,255,255,.22),
      0 0 22px -2px rgba(150,200,255,.55);
  }
  .tri {
    position: absolute; left: calc(50% + 26px); width: 11px; height: 13px;
    opacity: 0; transform: translateX(-5px); transition: opacity .18s, transform .18s var(--ease);
    filter: drop-shadow(0 0 7px rgba(175,212,255,.75));
  }
  .label {
    position: absolute; left: calc(50% + 48px); white-space: nowrap;
    font-size: 1.06rem; letter-spacing: .01em; color: #fff;
    opacity: 0; transition: opacity .18s;
    text-shadow: 0 0 14px rgba(160,200,255,.6), 0 1px 3px rgba(0,0,0,.7);
  }
  .items a[data-sel="1"] .tri,
  .items a[data-sel="1"] .label { opacity: 1; }
  .items a[data-sel="1"] .tri { transform: translateX(0); }
  .items a:focus-visible { outline: 1px solid rgba(255,255,255,.5); outline-offset: 4px; border-radius: 4px; }

  .empty a { color: rgba(226,238,255,.5); }
  .empty .label { position: static; opacity: 1; font-style: italic; font-size: .82rem; letter-spacing: .04em; }
  .empty .tile, .empty .tri { display: none; }


  /* ── sound ────────────────────────────────────────────────────────────── */
  .sound {
    position: fixed; right: 1.9rem; bottom: 1.2rem;
    width: 46px; height: 46px; display: grid; place-items: center;
    padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%;
    color: rgba(226,238,255,.5);
    transition: color .25s;
  }
  .sound:hover, .sound:focus-visible { color: #fff; }
  .sound:focus-visible { outline: 1px solid rgba(255,255,255,.4); outline-offset: 2px; }
  .sound svg {
    width: 23px; height: 23px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .sound .spk { fill: currentColor; stroke: none; }
  .sound .slash { opacity: 0; transition: opacity .2s; }
  .sound[data-muted="1"] { color: rgba(226,238,255,.3); }
  .sound[data-muted="1"] .slash { opacity: 1; }
  .sound[data-muted="1"] .w1, .sound[data-muted="1"] .w2 { opacity: .25; }
  .sound[data-ready="0"] .w1, .sound[data-ready="0"] .w2 { opacity: 0; }
  /* Before audio is unlocked, a slow ring says "there is something here". */
  .ring {
    position: absolute; inset: 7px; border-radius: 50%;
    border: 1px solid rgba(186,216,255,.4); opacity: 0;
  }
  .sound[data-ready="0"] .ring { animation: beckon 3.4s ease-out infinite; }
  @keyframes beckon {
    0%        { transform: scale(.7); opacity: .75; }
    70%, 100% { transform: scale(1.5); opacity: 0; }
  }

  /* ── footer ───────────────────────────────────────────────────────────── */
  .foot {
    position: fixed; left: 2.7rem; bottom: 1.9rem;
    font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(226,238,255,.22); text-decoration: none;
  }
  .foot:hover { color: rgba(226,238,255,.6); }

  @media (max-width: 560px) {
    .clock { top: 1.3rem; right: 1.3rem; }
    .clock time { font-size: 1.1rem; }
    .clock span { display: none; }
    .col { flex-basis: 150px; width: 150px; }
    .foot { left: 1.3rem; bottom: 1.1rem; }
    .sound { right: 1.1rem; bottom: .7rem; }
  }
  /* First paint: no transitions, so the initial selection is simply there. */
  body.booting *, body.booting *::before { transition: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .ribbon { animation: none; }
    .rail, .cat, .cat svg, .items a { transition: none; }
    .sound[data-ready="0"] .ring { animation: none; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="tint"></div>
  <svg class="wave" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="band1" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="660">
        <stop offset="0" stop-color="#cfe6ff" stop-opacity=".20"/>
        <stop offset=".45" stop-color="#9cc4ee" stop-opacity=".10"/>
        <stop offset="1" stop-color="#7ba7db" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="band2" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="880">
        <stop offset="0" stop-color="#b9d8ff" stop-opacity=".14"/>
        <stop offset=".5" stop-color="#7ea6d8" stop-opacity=".07"/>
        <stop offset="1" stop-color="#5b86bd" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <g class="glow">
      <path class="ribbon" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="rgba(120,170,230,.30)" stroke-width="150" fill="none"/>
    </g>

    <g>
      <path class="ribbon" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="url(#band1)" stroke-width="110" fill="none"/>
      <path class="ribbon crest" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="rgba(235,246,255,.38)" stroke-width="1.6" fill="none"/>

      <path class="ribbon b" d="M-200,650 C 240,590 460,720 760,650 C 1060,580 1260,690 1640,620"
            stroke="url(#band2)" stroke-width="70" opacity=".55" fill="none"/>
      <path class="ribbon b crest" d="M-200,650 C 240,590 460,720 760,650 C 1060,580 1260,690 1640,620"
            stroke="rgba(235,246,255,.26)" stroke-width="1.4" fill="none"/>

      <path class="ribbon c" d="M-200,330 C 260,280 460,410 800,340 C 1120,274 1320,360 1640,300"
            stroke="rgba(210,232,255,.05)" stroke-width="54" fill="none"/>
      <path class="ribbon c crest" d="M-200,330 C 260,280 460,410 800,340 C 1120,274 1320,360 1640,300"
            stroke="rgba(235,246,255,.16)" stroke-width="1.2" fill="none"/>
    </g>
  </svg>
</div>

<div class="clock">
  <time id="clock">--:--</time>
  <span id="date"></span>
</div>

<div class="xmb">
  <div class="rail" id="rail"></div>
</div>

<a class="foot" href="https://github.com/langscot/game-factory">github.com/langscot/game-factory</a>

<button class="sound" id="sound" type="button" aria-label="Sound — click to turn on" aria-pressed="false" data-ready="0" data-muted="0">
  <span class="ring" aria-hidden="true"></span>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path class="spk" d="M4.2 9.4h3.1L11.9 5.6v12.8L7.3 14.6H4.2z"/>
    <path class="w1" d="M14.9 9.3a4.1 4.1 0 0 1 0 5.4"/>
    <path class="w2" d="M17.6 6.7a7.7 7.7 0 0 1 0 10.6"/>
    <path class="slash" d="M4.6 4.6l14.8 14.8"/>
  </svg>
</button>

<script>
  const GAMES = __GAMES__;

  // A 9x8 invader, drawn as unit blocks — the most nostalgic shape there is.
  const INVADER = (() => {
    const rows = [
      "..#...#..",
      "...#.#...",
      "..#####..",
      ".##.#.##.",
      "#########",
      "#.#####.#",
      "#.#...#.#",
      "...##.##.",
    ];
    const px = 4.6, x0 = 3.3, y0 = 3.6;
    return rows
      .flatMap((row, y) => [...row].map((c, x) =>
        c === "#" ? `<rect x="${(x0 + x * px).toFixed(1)}" y="${(y0 + y * px).toFixed(1)}" width="${px}" height="${px}"/>` : ""))
      .join("");
  })();

  const ICON = {
    arcade:   INVADER,
    puzzle:   `<rect x="7" y="7" width="15" height="15" rx="4"/><rect x="26" y="7" width="15" height="15" rx="4" opacity=".45"/><rect x="7" y="26" width="15" height="15" rx="4" opacity=".45"/><rect x="26" y="26" width="15" height="15" rx="4"/>`,
    rts:      `<path d="M16 42V8"/><path d="M16 10h19l-4.5 7 4.5 7H16z" fill="currentColor" opacity=".32"/>`,
    tower:    `<rect x="15" y="19" width="18" height="23" rx="1"/><rect x="15" y="11" width="4.5" height="9" rx="1"/><rect x="21.75" y="11" width="4.5" height="9" rx="1"/><rect x="28.5" y="11" width="4.5" height="9" rx="1"/><path d="M22 42v-7h4v7"/>`,
    shooter:  `<circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="2" fill="currentColor" stroke="none"/><path d="M24 4v6M24 38v6M4 24h6M38 24h6"/>`,
    racing:   `<path d="M24 7l14 8v18l-14 8-14-8V15z"/><path d="M24 7v18l14 8M24 25L10 33" opacity=".55"/>`,
    platform: `<path d="M8 38h9V28h9V18h9"/><circle cx="37" cy="12" r="3" fill="currentColor" stroke="none"/>`,
    strategy: `<path d="M10 33h28l-3.5-15-7 6.5L24 14l-3.5 10.5-7-6.5z" fill="currentColor" opacity=".26"/><path d="M10 33h28l-3.5-15-7 6.5L24 14l-3.5 10.5-7-6.5z"/><path d="M12.5 39h23"/>`,
    other:    `<circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="4" fill="currentColor" stroke="none"/>`,
  };
  const key = (g) => String(g || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const svg = (genre) =>
    `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">${ICON[key(genre)] || ICON.other}</svg>`;
  // The invader is solid blocks, so it needs a fill and no stroke.
  const svgFor = (genre) =>
    key(genre) === "arcade"
      ? `<svg viewBox="0 0 48 48" fill="currentColor" stroke="none">${INVADER}</svg>`
      : svg(genre);

  const ORDER = ["arcade", "puzzle", "strategy", "rts", "tower", "shooter", "racing", "platform", "3d"];
  const cats = new Map();
  for (const g of GAMES) {
    const k = key(g.genre) || "other";
    if (!cats.has(k)) cats.set(k, []);
    cats.get(k).push(g);
  }
  if (!cats.size) cats.set("games", []);

  const rank = (k) => { const i = ORDER.indexOf(k); return i === -1 ? 99 : i; };
  const keys = [...cats.keys()].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // PS3 thumbnails were little coloured squares; ours get a stable colour per title.
  const hue = (s) => [...String(s)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);

  document.getElementById("rail").innerHTML = keys.map((k, i) => `
    <section class="col" data-i="${i}">
      <button class="cat" type="button" tabindex="-1" aria-label="${esc(k)}">
        ${svgFor(k)}<span>${esc(k)}</span>
      </button>
      <ul class="items${cats.get(k).length ? "" : " empty"}">
        ${cats.get(k).length
          ? cats.get(k).map((g) => `<li><a href="./games/${esc(g.slug)}/">${
              `<i class="tile" style="--h:${hue(g.title)}"></i>` +
              `<svg class="tri" viewBox="0 0 11 13" aria-hidden="true"><path d="M0 0l11 6.5L0 13z" fill="#fff"/></svg><span class="label">${esc(g.title)}</span>`
            }</a></li>`).join("")
          : `<li><a href="https://github.com/langscot/game-factory/issues/new/choose">
              <span class="label">nothing here yet — open an issue</span></a></li>`}
      </ul>
    </section>`).join("");

  const rail = document.getElementById("rail");
  const cols = [...rail.querySelectorAll(".col")];
  let cx = 0, cy = 0;

  function place() {
    const col = cols[cx];
    rail.style.transform = `translateX(${innerWidth / 2 - (col.offsetLeft + col.offsetWidth / 2)}px)`;

    cols.forEach((c, i) => {
      c.dataset.sel = i === cx ? "1" : "0";
      c.querySelectorAll(".items a").forEach((a, j) => {
        a.dataset.sel = i === cx && j === cy ? "1" : "0";
      });
    });
  }

  function move(dx, dy) {
    if (dx) {
      cx = (cx + dx + cols.length) % cols.length;
      const n = cols[cx].querySelectorAll(".items a").length;
      cy = Math.max(0, Math.min(cy, n - 1));
      swish();
    }
    if (dy) {
      const n = cols[cx].querySelectorAll(".items a").length;
      cy = Math.max(0, Math.min(n - 1, cy + dy));
      tick();
    }
    place();
  }

  // ── sound ────────────────────────────────────────────────────────────────
  // The console hum, synthesised. The site is static and offline, so there are no
  // audio files: the bed is three slowly drifting tones plus filtered noise, and
  // every effect is a short oscillator burst. Browsers won't start audio without
  // a gesture, so the graph is built on the first key press or click, and
  // suspended again when the tab goes away.
  const SOUND_KEY = "hub.sound";
  const BED_GAIN = 0.09;       // the hum sits under the effects, never over them
  const EFFECT_GAIN = 0.22;
  const BLIP_MS = 45;          // keeps mouse-over from machine-gunning the cursor blip
  const VOICES = [
    { hz: 55,    type: "sine",     gain: 0.5 },   // A1
    { hz: 82.41, type: "sine",     gain: 0.22 },  // E2, a fifth up
    { hz: 110,   type: "triangle", gain: 0.09 },  // A2, an octave up
  ];

  let sound = null;            // the audio graph, built on the first gesture
  let blippedAt = 0;
  let muted = (() => {
    try { return localStorage.getItem(SOUND_KEY) === "off"; } catch { return false; }
  })();

  function noiseBuffer(ctx) {
    const frames = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let warm = 0;
    for (let i = 0; i < frames; i++) {
      // Integrate white noise so it reads as air rather than hiss.
      warm = (warm + (Math.random() * 2 - 1) * 0.04) * 0.99;
      data[i] = warm * 3;
    }
    return buffer;
  }

  function bootAudio() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return null;
    const ctx = new AudioCtx();

    const master = ctx.createGain();
    master.gain.value = muted ? 0 : 1;
    master.connect(ctx.destination);

    const bed = ctx.createGain();
    bed.gain.value = 0;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 420;
    lp.Q.value = 0.7;
    lp.connect(bed).connect(master);

    // Slow, shallow modulation — a held sine on its own sounds like a test tone.
    const drift = (param, rate, depth) => {
      const lfo = ctx.createOscillator();
      lfo.frequency.value = rate;
      const amount = ctx.createGain();
      amount.gain.value = depth;
      lfo.connect(amount).connect(param);
      lfo.start();
    };

    for (const voice of VOICES) {
      const osc = ctx.createOscillator();
      osc.type = voice.type;
      osc.frequency.value = voice.hz;
      const gain = ctx.createGain();
      gain.gain.value = voice.gain;
      osc.connect(gain).connect(lp);
      drift(osc.detune, 0.03 + Math.random() * 0.05, 8);
      osc.start();
    }

    const noise = noiseBuffer(ctx);
    const air = ctx.createBufferSource();
    air.buffer = noise;
    air.loop = true;
    const band = ctx.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.value = 780;
    band.Q.value = 0.6;
    const airGain = ctx.createGain();
    airGain.gain.value = 0.35;
    air.connect(band).connect(airGain).connect(bed);
    drift(band.frequency, 0.055, 260);
    air.start();

    const sfx = ctx.createGain();
    sfx.gain.value = EFFECT_GAIN;
    sfx.connect(master);

    // Fade in: a hum that snaps on is startling, a hum that swells is a console.
    bed.gain.setValueAtTime(0, ctx.currentTime);
    bed.gain.linearRampToValueAtTime(BED_GAIN, ctx.currentTime + 3);

    return { ctx, master, sfx, noise };
  }

  // One-shot oscillator: fast attack, exponential tail.
  function tone(hz, { to = hz, type = "sine", dur = 0.2, level = 0.3, at = 0 } = {}) {
    const { ctx, sfx } = sound;
    const start = ctx.currentTime + at;
    const osc = ctx.createOscillator();
    osc.type = type;
    osc.frequency.setValueAtTime(hz, start);
    if (to !== hz) osc.frequency.exponentialRampToValueAtTime(to, start + dur * 0.85);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(level, start + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(sfx);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  // Filtered noise: the mechanical click under the cursor sounds.
  function tickNoise(level, hz, dur) {
    const { ctx, sfx, noise } = sound;
    const start = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noise;
    const hp = ctx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = hz;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(level, start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(hp).connect(gain).connect(sfx);
    src.start(start, Math.random() * 1.5, dur + 0.02);
  }

  // Down the list: the crisp little tick the XMB makes on every row.
  function tick() {
    if (!sound) return;
    const now = performance.now();
    if (now - blippedAt < BLIP_MS) return;
    blippedAt = now;
    tone(1240, { to: 1750, dur: 0.1, level: 0.3 });
    tickNoise(0.09, 3400, 0.018);
  }

  // Across the rail: heavier and lower, so the two axes sound different.
  function swish() {
    if (!sound) return;
    const now = performance.now();
    if (now - blippedAt < BLIP_MS) return;
    blippedAt = now;
    tone(190, { to: 150, type: "triangle", dur: 0.2, level: 0.34 });
    tickNoise(0.1, 700, 0.05);
  }

  // Enter: a short rising chime, quiet enough to sit under the bed.
  function confirm() {
    if (!sound) return;
    tone(784, { dur: 0.26, level: 0.16 });
    tone(1175, { at: 0.055, dur: 0.3, level: 0.11 });
    tone(1568, { at: 0.11, dur: 0.34, level: 0.06 });
  }

  // Unlocking audio is a gesture worth hearing, like a console coming on.
  function powerOn() {
    tone(220, { to: 330, dur: 0.9, level: 0.1 });
    tone(440, { to: 660, at: 0.12, dur: 0.8, level: 0.05 });
  }

  function wake() {
    if (!sound) {
      sound = bootAudio();
      if (!sound) return;
      if (!muted) powerOn();
    } else if (sound.ctx.state === "suspended") {
      sound.ctx.resume();
    }
    paintSound();
  }

  function setMuted(next) {
    muted = next;
    try { localStorage.setItem(SOUND_KEY, muted ? "off" : "on"); } catch {}
    if (sound) {
      const now = sound.ctx.currentTime;
      sound.master.gain.cancelScheduledValues(now);
      sound.master.gain.setTargetAtTime(muted ? 0 : 1, now, 0.04);
    }
    paintSound();
  }

  const soundBtn = document.getElementById("sound");

  function paintSound() {
    soundBtn.dataset.muted = muted ? "1" : "0";
    soundBtn.dataset.ready = sound ? "1" : "0";
    soundBtn.setAttribute("aria-pressed", String(!!sound && !muted));
    soundBtn.setAttribute("aria-label",
      !sound ? "Sound — click to turn on"
        : muted ? "Sound off — click to turn on"
          : "Sound on — click to turn off");
  }

  soundBtn.addEventListener("click", () => {
    if (!sound) { setMuted(false); wake(); return; }
    setMuted(!muted);
    if (!muted) confirm();
  });

  // The first key press or click is the gesture browsers need. The button is
  // skipped: its own click handler knows whether to start audio or mute it.
  const wakeOnGesture = (e) => {
    if (e.target instanceof Element && e.target.closest("#sound")) return;
    wake();
  };
  addEventListener("keydown", wakeOnGesture, true);
  addEventListener("pointerdown", wakeOnGesture, true);

  // Nobody should come back to a tab quietly humming away in the background.
  document.addEventListener("visibilitychange", () => {
    if (!sound) return;
    if (document.hidden) sound.ctx.suspend();
    else sound.ctx.resume();
  });

  paintSound();

  addEventListener("keydown", (e) => {
    const map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (map[e.key]) { e.preventDefault(); move(...map[e.key]); return; }
    if (e.key === "Enter") {
      // The sound button owns its own Enter/Space.
      if (e.target instanceof Element && e.target.closest("#sound")) return;
      const a = cols[cx].querySelectorAll(".items a")[cy];
      if (!a) return;
      confirm();
      // Let a beat of the confirmation play before the page unloads.
      if (sound && !muted) setTimeout(() => { location.href = a.href; }, 140);
      else location.href = a.href;
    }
  });

  cols.forEach((c, i) => {
    c.querySelector(".cat").addEventListener("click", () => {
      if (cx !== i) swish();
      cx = i; cy = 0; place();
    });
    c.querySelectorAll(".items a").forEach((a, j) => {
      a.addEventListener("mouseenter", () => {
        const across = cx !== i;
        if (!across && cy === j) return;
        cx = i; cy = j; place();
        if (across) swish(); else tick();
      });
    });
  });

  addEventListener("resize", place);

  // First paint without transitions: the rail would otherwise slide in from off-screen
  // and the labels would fade up on load.
  document.body.classList.add("booting");
  place();
  requestAnimationFrame(() => {
    rail.classList.add("ready");
    requestAnimationFrame(() => document.body.classList.remove("booting"));
  });

  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 15000);
</script>
</body>
</html>
