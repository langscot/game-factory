<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Factory</title>
<style>
  :root {
    color-scheme: dark;
    --ease: cubic-bezier(.22,.61,.36,1);
    --dim: rgba(232,242,255,.46);
    --lit: #fff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: #06080b;
    color: #fff;
    font: 300 16px/1.4 ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── the wave ─────────────────────────────────────────────────────────── */
  .bg { position: fixed; inset: 0; overflow: hidden; }
  .bg .tint {
    position: absolute; inset: 0;
    background:
      radial-gradient(75% 60% at 26% 10%, rgba(46,88,138,.60), transparent 70%),
      radial-gradient(60% 50% at 80% 84%, rgba(64,52,116,.45), transparent 72%),
      radial-gradient(95% 75% at 50% 42%, #0e1826, #06080b 80%);
  }
  .wave { position: absolute; inset: -8% -18%; width: 136%; height: 116%; transform: translateY(-3%); }
  .wave path { stroke-linecap: round; }
  .ribbon { animation: sweep 44s linear infinite; will-change: transform; }
  .ribbon.b { animation-duration: 63s; animation-direction: reverse; }
  .ribbon.c { animation-duration: 82s; }
  @keyframes sweep {
    from { transform: translate3d(-5%, 0, 0); }
    to   { transform: translate3d(5%, 0, 0); }
  }
  .crest { filter: blur(2.5px); }
  .glow  { filter: blur(34px); }


  /* ── clock ────────────────────────────────────────────────────────────── */
  .clock { position: fixed; top: 2.1rem; right: 2.7rem; text-align: right; pointer-events: none; }
  .clock time {
    display: block; font-size: 1.45rem; font-weight: 200; letter-spacing: .02em;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(0,0,0,.65);
  }
  .clock span {
    display: block; margin-top: .1rem; font-size: .64rem; letter-spacing: .16em;
    text-transform: uppercase; color: rgba(226,238,255,.4);
  }

  /* ── the rail ─────────────────────────────────────────────────────────── */
  .xmb { position: absolute; left: 0; right: 0; top: 43%; transform: translateY(-50%); overflow: hidden; }
  .rail {
    display: flex; align-items: flex-start;
    will-change: transform;
  }
  .rail.ready { transition: transform .42s var(--ease); }
  .col { flex: 0 0 172px; width: 172px; display: flex; flex-direction: column; align-items: center; }

  .cat {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: .5rem;
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
    color: var(--dim);
    transition: color .3s, transform .3s var(--ease), opacity .3s;
  }
  .cat svg { width: 46px; height: 46px; transition: width .3s var(--ease), height .3s var(--ease), filter .3s; }
  .cat span {
    font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; color: #fff;
    opacity: 0; transition: opacity .3s; text-shadow: 0 0 10px rgba(170,210,255,.7);
  }
  .col[data-sel="1"] .cat { color: var(--lit); }
  .col[data-sel="1"] .cat span { color: #fff; }
  .col[data-sel="1"] .cat svg {
    width: 54px; height: 54px; stroke-width: 1.2;
    filter: drop-shadow(0 0 12px rgba(180,215,255,.9)) drop-shadow(0 0 3px rgba(255,255,255,.85));
  }
  .col[data-sel="1"] .cat span { opacity: 1; }
  .cat::after {
    content: ""; position: absolute; inset: -22px -30px; border-radius: 999px;
    background: radial-gradient(closest-side, rgba(150,195,255,.30), transparent);
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .col[data-sel="1"] .cat::after { opacity: 1; }

  /* ── the list ─────────────────────────────────────────────────────────── */
  .items { list-style: none; margin: 2.3rem 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; }
  .items a {
    position: relative; display: grid; place-items: center; height: 54px;
    text-decoration: none; color: var(--dim);
    transition: color .2s;
  }
  .tile {
    width: 26px; height: 26px; border-radius: 3px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.45), rgba(255,255,255,0) 55%),
      hsl(var(--h, 210) 46% 43%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 1px 6px rgba(0,0,0,.45);
    transition: width .2s var(--ease), height .2s var(--ease), filter .2s;
  }
  .items a[data-sel="1"] .tile {
    width: 32px; height: 32px;
    filter: drop-shadow(0 0 10px rgba(160,205,255,.45)) brightness(1.12);
  }
  .tri {
    position: absolute; left: calc(50% + 22px); border: 9px solid transparent;
    border-left: 14px solid #fff; margin-left: 6px;
    opacity: 0; transform: translateX(-4px); transition: opacity .18s, transform .18s var(--ease);
    filter: drop-shadow(0 0 8px rgba(170,210,255,.8));
  }
  .label {
    position: absolute; left: calc(50% + 54px); white-space: nowrap;
    font-size: 1.06rem; letter-spacing: .01em; color: #fff;
    opacity: 0; transition: opacity .18s;
    text-shadow: 0 0 14px rgba(160,200,255,.6), 0 1px 3px rgba(0,0,0,.7);
  }
  .items a[data-sel="1"] .tri,
  .items a[data-sel="1"] .label { opacity: 1; }
  .items a[data-sel="1"] .tri { transform: translateX(0); }
  .items a:focus-visible { outline: 1px solid rgba(255,255,255,.5); outline-offset: 4px; border-radius: 4px; }

  .empty a { color: rgba(226,238,255,.5); }
  .empty .label { position: static; opacity: 1; font-style: italic; font-size: .82rem; letter-spacing: .04em; }
  .empty .tile, .empty .tri { display: none; }


  /* ── footer ───────────────────────────────────────────────────────────── */
  .foot {
    position: fixed; left: 2.7rem; bottom: 1.9rem;
    font-size: .62rem; letter-spacing: .18em; text-transform: uppercase;
    color: rgba(226,238,255,.22); text-decoration: none;
  }
  .foot:hover { color: rgba(226,238,255,.6); }

  @media (max-width: 560px) {
    .clock { top: 1.3rem; right: 1.3rem; }
    .clock time { font-size: 1.1rem; }
    .clock span { display: none; }
    .col { flex-basis: 150px; width: 150px; }
    .foot { left: 1.3rem; bottom: 1.1rem; }
  }
  /* First paint: no transitions, so the initial selection is simply there. */
  body.booting *, body.booting *::before { transition: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .ribbon { animation: none; }
    .rail, .cat, .cat svg, .items a { transition: none; }
  }
</style>
</head>
<body>

<div class="bg">
  <div class="tint"></div>
  <svg class="wave" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="band1" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="660">
        <stop offset="0" stop-color="#cfe6ff" stop-opacity=".20"/>
        <stop offset=".45" stop-color="#9cc4ee" stop-opacity=".10"/>
        <stop offset="1" stop-color="#7ba7db" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="band2" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="880">
        <stop offset="0" stop-color="#b9d8ff" stop-opacity=".14"/>
        <stop offset=".5" stop-color="#7ea6d8" stop-opacity=".07"/>
        <stop offset="1" stop-color="#5b86bd" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <g class="glow">
      <path class="ribbon" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="rgba(120,170,230,.30)" stroke-width="150" fill="none"/>
    </g>

    <g>
      <path class="ribbon" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="url(#band1)" stroke-width="110" fill="none"/>
      <path class="ribbon crest" d="M-200,470 C 200,400 420,560 720,480 C 1020,400 1240,520 1640,440"
            stroke="rgba(235,246,255,.38)" stroke-width="1.6" fill="none"/>

      <path class="ribbon b" d="M-200,650 C 240,590 460,720 760,650 C 1060,580 1260,690 1640,620"
            stroke="url(#band2)" stroke-width="70" opacity=".55" fill="none"/>
      <path class="ribbon b crest" d="M-200,650 C 240,590 460,720 760,650 C 1060,580 1260,690 1640,620"
            stroke="rgba(235,246,255,.26)" stroke-width="1.4" fill="none"/>

      <path class="ribbon c" d="M-200,330 C 260,280 460,410 800,340 C 1120,274 1320,360 1640,300"
            stroke="rgba(210,232,255,.05)" stroke-width="54" fill="none"/>
      <path class="ribbon c crest" d="M-200,330 C 260,280 460,410 800,340 C 1120,274 1320,360 1640,300"
            stroke="rgba(235,246,255,.16)" stroke-width="1.2" fill="none"/>
    </g>
  </svg>
</div>

<div class="clock">
  <time id="clock">--:--</time>
  <span id="date"></span>
</div>

<div class="xmb">
  <div class="rail" id="rail"></div>
</div>

<a class="foot" href="https://github.com/langscot/game-factory">github.com/langscot/game-factory</a>

<script>
  const GAMES = __GAMES__;

  const ICON = {
    arcade:   `<rect x="7" y="7" width="34" height="34" rx="9"/><path d="M17 24h11M22.5 18.5v11"/><circle cx="32" cy="19" r="1.6"/><circle cx="36" cy="25" r="1.6"/>`,
    puzzle:   `<rect x="7" y="7" width="14" height="14" rx="3"/><rect x="27" y="7" width="14" height="14" rx="3"/><rect x="7" y="27" width="14" height="14" rx="3"/><rect x="27" y="27" width="14" height="14" rx="3"/>`,
    rts:      `<path d="M15 41V8"/><path d="M15 9h20l-5.5 8 5.5 8H15z"/>`,
    tower:    `<path d="M24 6l11 9v6H13v-6z"/><path d="M13 26h22v8H13z"/><path d="M17 40h14"/>`,
    shooter:  `<circle cx="24" cy="24" r="13"/><path d="M24 4v9M24 35v9M4 24h9M35 24h9"/>`,
    racing:   `<path d="M24 7l14 8.5v17L24 41 10 32.5v-17z"/><path d="M24 7v17l14 8.5M24 24L10 32.5"/>`,
    platform: `<path d="M7 39h10V28h10V17h11"/><circle cx="37" cy="10" r="3"/>`,
    strategy: `<path d="M9 40V13l15 6 15-6v27"/><path d="M9 40h30"/>`,
    other:    `<circle cx="24" cy="24" r="15"/><circle cx="24" cy="24" r="3.5"/>`,
  };
  const key = (g) => String(g || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const svg = (genre) =>
    `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">${ICON[key(genre)] || ICON.other}</svg>`;

  const ORDER = ["arcade", "puzzle", "strategy", "rts", "tower", "shooter", "racing", "platform", "3d"];
  const cats = new Map();
  for (const g of GAMES) {
    const k = key(g.genre) || "other";
    if (!cats.has(k)) cats.set(k, []);
    cats.get(k).push(g);
  }
  if (!cats.size) cats.set("games", []);

  const rank = (k) => { const i = ORDER.indexOf(k); return i === -1 ? 99 : i; };
  const keys = [...cats.keys()].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // PS3 thumbnails were little coloured squares; ours get a stable colour per title.
  const hue = (s) => [...String(s)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 7);

  document.getElementById("rail").innerHTML = keys.map((k, i) => `
    <section class="col" data-i="${i}">
      <button class="cat" type="button" tabindex="-1" aria-label="${esc(k)}">
        ${svg(k)}<span>${esc(k)}</span>
      </button>
      <ul class="items${cats.get(k).length ? "" : " empty"}">
        ${cats.get(k).length
          ? cats.get(k).map((g) => `<li><a href="./games/${esc(g.slug)}/">${
              `<i class="tile" style="--h:${hue(g.title)}"></i>` +
              `<span class="tri"></span><span class="label">${esc(g.title)}</span>`
            }</a></li>`).join("")
          : `<li><a href="https://github.com/langscot/game-factory/issues/new/choose">
              <span class="label">nothing here yet — open an issue</span></a></li>`}
      </ul>
    </section>`).join("");

  const rail = document.getElementById("rail");
  const cols = [...rail.querySelectorAll(".col")];
  let cx = 0, cy = 0;

  function place() {
    const col = cols[cx];
    rail.style.transform = `translateX(${innerWidth / 2 - (col.offsetLeft + col.offsetWidth / 2)}px)`;

    cols.forEach((c, i) => {
      c.dataset.sel = i === cx ? "1" : "0";
      c.querySelectorAll(".items a").forEach((a, j) => {
        a.dataset.sel = i === cx && j === cy ? "1" : "0";
      });
    });
  }

  function move(dx, dy) {
    if (dx) {
      cx = (cx + dx + cols.length) % cols.length;
      const n = cols[cx].querySelectorAll(".items a").length;
      cy = Math.max(0, Math.min(cy, n - 1));
    }
    if (dy) {
      const n = cols[cx].querySelectorAll(".items a").length;
      cy = Math.max(0, Math.min(n - 1, cy + dy));
    }
    place();
  }

  addEventListener("keydown", (e) => {
    const map = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (map[e.key]) { e.preventDefault(); move(...map[e.key]); return; }
    if (e.key === "Enter") {
      const a = cols[cx].querySelectorAll(".items a")[cy];
      if (a) location.href = a.href;
    }
  });

  cols.forEach((c, i) => {
    c.querySelector(".cat").addEventListener("click", () => { cx = i; cy = 0; place(); });
    c.querySelectorAll(".items a").forEach((a, j) => {
      a.addEventListener("mouseenter", () => { cx = i; cy = j; place(); });
    });
  });

  addEventListener("resize", place);

  // First paint without transitions: the rail would otherwise slide in from off-screen
  // and the labels would fade up on load.
  document.body.classList.add("booting");
  place();
  requestAnimationFrame(() => {
    rail.classList.add("ready");
    requestAnimationFrame(() => document.body.classList.remove("booting"));
  });

  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    document.getElementById("date").textContent =
      now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
  }
  tick();
  setInterval(tick, 15000);
</script>
</body>
</html>
