<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Helpdesk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563c9'/%3E%3Ctext x='16' y='23' font-size='18' font-family='sans-serif' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1a;
    --accent: #4c9aff;
    --text: #e8edf6;
    --dim: #96a2b8;
    --line: rgba(255, 255, 255, 0.1);
    --panel: rgba(20, 26, 38, 0.82);
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 10px; }

  /* ---------- desktop ---------- */
  .desktop {
    position: fixed; inset: 0 0 52px 0; overflow: hidden;
    background:
      radial-gradient(900px 620px at 12% 8%, rgba(44, 92, 173, .55), transparent 62%),
      radial-gradient(800px 560px at 88% 88%, rgba(99, 54, 160, .45), transparent 60%),
      radial-gradient(700px 480px at 62% 30%, rgba(16, 84, 120, .35), transparent 65%),
      linear-gradient(165deg, #0a1330 0%, #070b18 55%, #04060e 100%);
  }
  .desktop::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 3px 3px; opacity: .5;
  }

  .icons {
    position: absolute; inset: 14px auto auto 14px;
    display: grid; gap: 6px; width: 92px;
  }
  .icon {
    display: grid; justify-items: center; gap: 4px; padding: 8px 4px 6px;
    background: none; border: 1px solid transparent; border-radius: 8px;
    cursor: pointer; color: var(--text);
  }
  .icon:hover, .icon:focus-visible { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.14); outline: none; }
  .icon b {
    font-weight: 400; font-size: 11px; line-height: 1.2; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .icon i {
    font-style: normal; font-size: 27px; line-height: 1; width: 44px; height: 44px;
    display: grid; place-items: center; border-radius: 10px;
    background: rgba(16, 24, 40, .62);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 6px 14px -8px #000;
  }

  /* ---------- windows ---------- */
  #windows { position: absolute; inset: 0; }
  .win {
    position: absolute; display: none; flex-direction: column; min-width: 280px;
    background: var(--panel); backdrop-filter: blur(20px) saturate(120%);
    border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
    box-shadow: 0 30px 70px -24px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .win.is-open { display: flex; }
  .win:not(.is-focused) { border-color: rgba(255,255,255,.07); }
  .win.is-focused { border-color: rgba(120,175,255,.4); }
  .win.is-max { left: 6px !important; top: 6px !important; width: calc(100% - 12px) !important; height: calc(100% - 12px) !important; }
  .titlebar {
    display: flex; align-items: center; gap: 8px; height: 34px; flex: none;
    padding: 0 4px 0 10px; background: rgba(255,255,255,.04);
    border-bottom: 1px solid var(--line); cursor: default; touch-action: none;
  }
  .titlebar .tb-ico { font-size: 13px; opacity: .9; }
  .titlebar .tb-name {
    flex: 1; font-size: 12px; letter-spacing: .01em; color: #cfd8e8;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .win-btns { display: flex; }
  .win-btns button {
    width: 34px; height: 30px; border: 0; border-radius: 6px; background: none;
    color: #b9c4d6; cursor: pointer; font-size: 12px; line-height: 1;
  }
  .win-btns button:hover { background: rgba(255,255,255,.12); }
  .win-btns button[data-act="close"]:hover { background: #c42b1c; color: #fff; }
  .win-body { flex: 1; min-height: 0; overflow: auto; }

  @media (max-width: 720px) {
    .win { left: 4px !important; top: 4px !important; width: calc(100vw - 8px) !important; height: calc(100vh - 60px) !important; }
    .desktop { inset: 0 0 60px 0; }
    .icons { width: 78px; grid-template-columns: 1fr; }
    .titlebar { cursor: default; }
  }

  /* ---------- taskbar ---------- */
  .taskbar {
    position: fixed; inset: auto 0 0 0; height: 52px; z-index: 9000;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
    background: rgba(14, 19, 29, .8); backdrop-filter: blur(24px) saturate(130%);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .tb-side { flex: 1; display: flex; align-items: center; gap: 6px; }
  .tb-side.right { justify-content: flex-end; }
  .tb-center { display: flex; align-items: center; gap: 6px; }
  .tb-btn {
    height: 38px; min-width: 40px; padding: 0 8px; display: grid; place-items: center;
    border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer;
    color: var(--text); font-size: 16px;
  }
  .tb-btn:hover { background: rgba(255,255,255,.1); }
  .tb-btn.is-active { background: rgba(76,154,255,.18); border-color: rgba(76,154,255,.35); }
  .tb-btn small { font-size: 11px; margin-left: 5px; display: none; }
  .logo { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 16px; height: 16px; }
  .logo i { background: #6fb2ff; border-radius: 1px; }
  .tb-task {
    height: 38px; max-width: 140px; padding: 0 10px; display: flex; align-items: center; gap: 7px;
    border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer;
    font-size: 12px; color: #cbd5e6;
  }
  .tb-task:hover { background: rgba(255,255,255,.09); }
  .tb-task.is-active { background: rgba(76,154,255,.16); border-color: rgba(76,154,255,.3); }
  .tb-task span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tray {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 8px;
    font-size: 11px; color: var(--dim); background: rgba(255,255,255,.04);
  }
  .tray b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .tray.low b { color: var(--bad); }
  .clock { font-size: 12px; color: #cfd8e8; font-variant-numeric: tabular-nums; padding-right: 4px; }

  /* ---------- start menu ---------- */
  .start {
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
    width: min(420px, 92vw); z-index: 9100; padding: 14px;
    background: rgba(18, 24, 36, .93); backdrop-filter: blur(26px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    box-shadow: 0 30px 80px -20px #000;
  }
  .start h2 { margin: 2px 4px 12px; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .start-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .start-app {
    display: grid; justify-items: center; gap: 6px; padding: 12px 4px; cursor: pointer;
    background: none; border: 1px solid transparent; border-radius: 10px; font-size: 12px;
  }
  .start-app:hover { background: rgba(255,255,255,.09); }
  .start-app i { font-style: normal; font-size: 22px; }

  /* ---------- shared app bits ---------- */
  .pad { padding: 14px; }
  .btn {
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
    border-radius: 7px; padding: 7px 12px; cursor: pointer; font-size: 13px;
  }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.primary { background: #2563c9; border-color: #3b82f6; color: #fff; }
  .btn.primary:hover { background: #2f74e0; }
  .btn.ok { background: rgba(74,222,128,.14); border-color: rgba(74,222,128,.4); color: #b9f6c9; }
  .btn.no { background: rgba(248,113,113,.14); border-color: rgba(248,113,113,.4); color: #fbcaca; }
  .btn.esc { background: rgba(251,191,36,.12); border-color: rgba(251,191,36,.38); color: #fbe3a3; }
  .muted { color: var(--dim); }
  .tiny { font-size: 11.5px; }

  /* ---------- ticket desk ---------- */
  .hd { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .hd-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none;
    border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--dim);
  }
  .hd-head b { color: var(--text); font-weight: 500; }
  .hd-bar { flex: 1; height: 5px; border-radius: 5px; background: rgba(255,255,255,.1); overflow: hidden; }
  .hd-bar i { display: block; height: 100%; background: linear-gradient(90deg, #4c9aff, #93c5fd); transition: width .2s linear; }
  .hd-bar.low i { background: linear-gradient(90deg, #f87171, #fbbf24); }
  .hd-main { flex: 1; min-height: 0; display: flex; }
  .hd-queue { width: 168px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 6px; }
  .qitem {
    display: flex; gap: 7px; align-items: baseline; width: 100%; text-align: left;
    padding: 6px 7px; margin-bottom: 3px; border-radius: 6px; border: 1px solid transparent;
    background: none; cursor: pointer; font-size: 12px; color: #c6d0e2;
  }
  .qitem:hover { background: rgba(255,255,255,.07); }
  .qitem.sel { background: rgba(76,154,255,.18); border-color: rgba(76,154,255,.35); color: #fff; }
  .qitem .st { width: 12px; text-align: center; font-size: 11px; }
  .qitem .st.ok { color: var(--good); }
  .qitem .st.bad { color: var(--bad); }
  .qitem .who { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .hd-detail { flex: 1; min-width: 0; overflow: auto; padding: 14px; }
  .ticket h3 { margin: 2px 0 10px; font-size: 16px; font-weight: 600; line-height: 1.25; }
  .ticket .meta { font-size: 12px; color: var(--dim); margin-bottom: 12px; line-height: 1.6; }
  .ticket .meta b { color: #dbe4f3; font-weight: 500; }
  .ticket .body {
    font-size: 13.5px; line-height: 1.6; color: #d7dfed; background: rgba(255,255,255,.04);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; white-space: pre-wrap;
  }
  .ticket .body.warn-mail { border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.07); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .verdict { margin-top: 14px; padding: 11px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.55; }
  .verdict.good { background: rgba(74,222,128,.1); border: 1px solid rgba(74,222,128,.35); }
  .verdict.bad { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); }
  .verdict b { display: block; margin-bottom: 3px; }
  .empty { display: grid; place-items: center; height: 100%; text-align: center; padding: 24px; }
  .empty h3 { margin: 8px 0; font-size: 17px; }
  .empty p { margin: 0 0 14px; color: var(--dim); max-width: 34ch; font-size: 13px; }

  /* ---------- directory ---------- */
  .dir { display: flex; flex-direction: column; height: 100%; }
  .dir-top { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .dir input {
    flex: 1; min-width: 0; background: rgba(0,0,0,.28); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); padding: 6px 9px; font: inherit; font-size: 12.5px;
  }
  .dir input:focus { outline: 1px solid var(--accent); }
  table.staff { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.staff th {
    text-align: left; font-weight: 500; color: var(--dim); padding: 7px 10px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #151b27; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .07em;
  }
  table.staff td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.05); }
  table.staff tr:hover td { background: rgba(255,255,255,.04); }
  .tag { font-size: 10.5px; padding: 1px 6px; border-radius: 20px; border: 1px solid var(--line); color: var(--dim); }
  .tag.ft { color: #a9d5ff; border-color: rgba(120,175,255,.4); }
  .tag.ct { color: #fbd38d; border-color: rgba(251,191,36,.35); }
  .tag.in { color: #c4b5fd; border-color: rgba(167,139,250,.35); }
  .yes { color: var(--good); }
  .no { color: #8c97a9; }

  /* ---------- handbook ---------- */
  .book { display: flex; height: 100%; }
  .book nav { width: 132px; flex: none; border-right: 1px solid var(--line); padding: 8px; overflow: auto; }
  .book nav button {
    display: block; width: 100%; text-align: left; padding: 7px 8px; margin-bottom: 3px;
    border: 1px solid transparent; border-radius: 6px; background: none; cursor: pointer;
    font-size: 12px; color: #c6d0e2;
  }
  .book nav button:hover { background: rgba(255,255,255,.07); }
  .book nav button.sel { background: rgba(76,154,255,.18); border-color: rgba(76,154,255,.32); color: #fff; }
  .book article { flex: 1; min-width: 0; overflow: auto; padding: 16px 18px; }
  .book h3 { margin: 0 0 4px; font-size: 17px; }
  .book .pnum { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 12px; }
  .book ul { margin: 0; padding-left: 18px; }
  .book li { margin-bottom: 9px; line-height: 1.55; font-size: 13px; color: #d7dfed; }
  .book .new { color: var(--warn); font-size: 10.5px; border: 1px solid rgba(251,191,36,.4); padding: 1px 6px; border-radius: 20px; margin-left: 6px; }

  /* ---------- mail ---------- */
  .mail { display: flex; height: 100%; }
  .mail-list { width: 180px; flex: none; border-right: 1px solid var(--line); overflow: auto; padding: 6px; }
  .mail-list button {
    display: block; width: 100%; text-align: left; padding: 8px; margin-bottom: 3px;
    border: 1px solid transparent; border-radius: 7px; background: none; cursor: pointer; font-size: 11.5px; color: #c6d0e2;
  }
  .mail-list button:hover { background: rgba(255,255,255,.07); }
  .mail-list button.sel { background: rgba(76,154,255,.16); border-color: rgba(76,154,255,.3); }
  .mail-list b { display: block; font-weight: 500; color: #e2e9f6; margin-bottom: 2px; }
  .mail-read { flex: 1; min-width: 0; overflow: auto; padding: 16px 18px; }
  .mail-read h3 { margin: 0 0 6px; font-size: 16px; }
  .mail-read .from { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .mail-read p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #d7dfed; }
  .mail-read .newrule {
    margin-top: 14px; padding: 10px 12px; border-radius: 8px;
    background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.32); font-size: 12.5px;
  }

  /* ---------- overlays ---------- */
  .boot {
    position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
    background: #05080f; transition: opacity .35s ease;
    background-image: radial-gradient(700px 500px at 50% 40%, rgba(40, 90, 180, .22), transparent 70%);
  }
  .boot.gone { opacity: 0; pointer-events: none; }
  .boot-card { text-align: center; padding: 20px; }
  .boot-logo {
    width: 62px; height: 62px; margin: 0 auto 18px; border-radius: 16px;
    display: grid; place-items: center; font-size: 30px; color: #cfe2ff;
    background: linear-gradient(160deg, #1d4f9c, #12305e);
    box-shadow: 0 0 0 1px rgba(140,190,255,.35), 0 20px 40px -20px #000;
  }
  .boot-card h1 { margin: 0 0 4px; font-size: 21px; font-weight: 600; letter-spacing: .01em; }
  .boot-card p { margin: 0 0 22px; color: var(--dim); font-size: 12.5px; }
  .boot-card small { display: block; margin-top: 14px; color: #55637a; font-size: 11px; }

  .modal {
    position: fixed; inset: 0; z-index: 9500; display: grid; place-items: center;
    background: rgba(4, 7, 14, .72); backdrop-filter: blur(6px); padding: 18px;
  }
  .modal-card {
    width: min(460px, 100%); max-height: 86vh; overflow: auto;
    background: rgba(21, 27, 40, .97); border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px; padding: 22px; box-shadow: 0 40px 90px -30px #000;
  }
  .modal-card h2 { margin: 0 0 4px; font-size: 19px; }
  .modal-card .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .modal-card p { font-size: 13px; line-height: 1.6; color: #d7dfed; margin: 0 0 10px; }
  .modal-card .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .modal-card .stat { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; }
  .modal-card .stat b { display: block; font-size: 19px; font-weight: 600; }
  .modal-card .stat span { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  .modal-card .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-card .quote { border-left: 2px solid rgba(251,191,36,.5); padding-left: 11px; color: #e6d9b4; font-size: 12.5px; font-style: italic; margin: 12px 0; }
  @media (max-width: 720px) {
    .modal-card { padding: 18px; }
    .hd-queue { width: 118px; }
    .book nav { width: 104px; }
    .mail-list { width: 120px; }
  }
</style>
</head>
<body>
  <div class="desktop" id="desktop">
    <div class="icons" id="icons"></div>
    <div id="windows"></div>
  </div>

  <footer class="taskbar">
    <div class="tb-side"></div>
    <div class="tb-center">
      <button class="tb-btn" id="startbtn" aria-label="Start" aria-expanded="false">
        <span class="logo"><i></i><i></i><i></i><i></i></span>
      </button>
      <div id="tb-running" style="display:flex;gap:6px"></div>
    </div>
    <div class="tb-side right">
      <div class="tray" id="tray"><span>Trust</span> <b>100</b></div>
      <div class="clock" id="clock">09:00</div>
    </div>
  </footer>

  <div class="start" id="start" hidden>
    <h2>Halcyon IT</h2>
    <div class="start-grid" id="start-grid"></div>
  </div>

  <div class="boot" id="boot">
    <div class="boot-card">
      <div class="boot-logo">◈</div>
      <h1>Halcyon Dynamics</h1>
      <p>IT Service Desk · Terminal 04</p>
      <button class="btn primary" id="signin">Sign in</button>
      <small>or press Enter</small>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
